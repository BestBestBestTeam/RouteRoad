name: routeroad

services:
  postgres:
    image: postgres:18.6
    container_name: routeroad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: routeroad
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
