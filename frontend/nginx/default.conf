server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Backend integration is deliberately deferred. Never return SPA HTML here.
    location = /api {
        default_type application/json;
        return 503 '{"error":{"code":"API_NOT_CONNECTED","message":"Backend integration is not configured."}}';
    }

    location ^~ /api/ {
        default_type application/json;
        return 503 '{"error":{"code":"API_NOT_CONNECTED","message":"Backend integration is not configured."}}';
    }

    # Public assets retain their source filenames and must be revalidated.
    location ^~ /assets/icons/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Only Vite's content-hashed output is immutable.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|png|jpe?g|svg|webp|avif)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router owns client paths, including deep links after a reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
